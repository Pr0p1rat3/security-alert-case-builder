services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sacb
      POSTGRES_USER: sacb
      POSTGRES_PASSWORD: sacb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sacb -d sacb"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  backend:
    build:
      context: ./backend
    environment:
      SACB_ENVIRONMENT: development
      SACB_DATABASE_URL: postgresql+psycopg://sacb:sacb@postgres:5432/sacb
      SACB_REDIS_URL: redis://redis:6379/0
      SACB_JWT_SECRET: change-this-local-dev-secret
      SACB_CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173
      SACB_EVIDENCE_STORAGE_PATH: /data/evidence
      SACB_SEED_ADMIN_EMAIL: admin@example.com
      SACB_SEED_ADMIN_PASSWORD: ChangeMe123!
    volumes:
      - evidence-data:/data/evidence
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"

  worker:
    build:
      context: ./backend
    command: ["rq", "worker", "--url", "redis://redis:6379/0", "default"]
    environment:
      SACB_ENVIRONMENT: development
      SACB_DATABASE_URL: postgresql+psycopg://sacb:sacb@postgres:5432/sacb
      SACB_REDIS_URL: redis://redis:6379/0
      SACB_JWT_SECRET: change-this-local-dev-secret
      SACB_EVIDENCE_STORAGE_PATH: /data/evidence
    volumes:
      - evidence-data:/data/evidence
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  postgres-data:
  redis-data:
  evidence-data:
